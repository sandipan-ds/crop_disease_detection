name: Deploy

on:
  push:
    branches: [main]

jobs:
  test-backend:
    uses: ./.github/workflows/ci.yml

  test-frontend:
    uses: ./.github/workflows/ci.yml

  deploy-api:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crop-disease-api
          region: us-central1
          source: ./api
          env_vars: |
            GCS_BUCKET_NAME=crop-disease-detection-1

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SA }}
          projectId: crop-disease-detection-496608
          channelId: live

  smoke-test:
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - name: Wait for deployment
        run: sleep 90

      - name: Health check
        run: |
          curl -f https://crop-disease-api-1049249498032.us-central1.run.app/health

      - name: Models list check
        run: |
          curl -f https://crop-disease-api-1049249498032.us-central1.run.app/models
